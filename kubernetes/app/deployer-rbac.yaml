apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-deployer
  namespace: diplom-app
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-deployer
  namespace: diplom-app
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["diplom-app"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-deployer
  namespace: diplom-app
subjects:
  - kind: ServiceAccount
    name: app-deployer
    namespace: diplom-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: app-deployer
